name: Feature request
description: Propose a change to the template, a preset, or the tooling
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you doing today, and where does it break down? Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like the skeleton to do.
    validations:
      required: true

  - type: dropdown
    id: ownership
    attributes:
      label: Which side does this touch
      description: See skeleton.manifest.json. Skeleton-owned changes reach every downstream project via skeleton.update.
      options:
        - Skeleton-owned (.docker, Makefile, scripts, .presets/_infra, CI)
        - Project-owned (apps, .presets/<name>, packages, project docs)
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is for local development, not a production deployment concern.
          required: true
