name: ${PROJECT_NAME:-project_skeleton}

services:
  gateway:
    build:
      context: ..
      dockerfile: .docker/nginx/Dockerfile
    depends_on:
      php:
        condition: service_started
        required: false
      node:
        condition: service_started
        required: false
    environment:
      APP_PRESET: ${APP_PRESET:-none}
    ports:
      - "127.0.0.1:${PORT_HTTP}:80"
    volumes:
      - ../apps:/workspace/apps:ro

  php:
    profiles: ["laravel", "legacy"]
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /workspace/apps
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_PRESET: ${APP_PRESET:-none}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
    volumes:
      - ../apps:/workspace/apps
      - composer-cache:/tmp/composer-cache

  node:
    profiles: ["next", "legacy"]
    build:
      context: ..
      dockerfile: .docker/node/Dockerfile
    working_dir: /workspace/apps
    command: ["sh", "/usr/local/bin/start-node-preset"]
    environment:
      APP_PRESET: ${APP_PRESET:-none}
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost}
    volumes:
      - ../apps:/workspace/apps
      - node-cache:/workspace/.cache

  tools:
    build:
      context: ..
      dockerfile: .docker/tools/Dockerfile
    user: "${TOOLS_UID:-1000}:${TOOLS_GID:-1000}"
    working_dir: /workspace
    volumes:
      - ../:/workspace

  queue:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: .docker/php/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /workspace/apps
    command: ["sh", "/usr/local/bin/start-queue-preset"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_PRESET: ${APP_PRESET:-none}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - ../apps:/workspace/apps
      - composer-cache:/tmp/composer-cache

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${PORT_DB}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.8-alpine
    ports:
      - "127.0.0.1:${PORT_REDIS}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "127.0.0.1:${PORT_MAIL}:8025"

volumes:
  composer-cache:
  node-cache:
  mysql-data:
  redis-data:
